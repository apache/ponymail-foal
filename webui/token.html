<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Pony Mail - Session token</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" media="all">
    <link href="css/scaffolding.css?revision=5e59be9" rel="stylesheet" media="all">
    <style>
      #token_card { margin: 0 auto; max-width: 640px; text-align: left; font-size: 12pt; }
      #token_card .who { font-weight: bold; }
      #token_card .warn { background: #fcf8e3; border-left: 4px solid #f0ad4e; padding: 8px 12px; margin: 12px 0; }
      #token_card .buttons { margin-top: 18px; text-align: center; }
      #token_card .buttons button { margin: 0 8px; min-width: 120px; }
      #token_value { font-family: monospace; word-break: break-all; }
    </style>
  </head>
  <body style="margin: 0px;">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12" style="text-align: center">
          <img src="images/logo.png" alt="Foal logo" style="width: 320px;"/><br/>
          <h3>Session token request</h3>
          <div id="token_card">Checking your session, hang on...</div>
        </div>
      </div>
    </div>
    <script src="js/config.js?revision=5e59be9"></script>
    <script src="js/token.js?revision=5e59be9"></script>
